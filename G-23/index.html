<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay">

<div class="container">

<div class="logo">
<img src="logo.jpeg" alt="Logo">
<h1>Student Registration Form</h1>
</div>

<form id="registrationForm">

<div class="input-box">
<label>Full Name</label>
<input type="text" id="name" required pattern="[A-Za-z ]+" placeholder="Enter Full Name">
</div>

<div class="input-box">
<label>Roll Number</label>
<input type="number" id="roll" required placeholder="Enter Roll Number">
</div>

<div class="input-box">
<label>Email</label>
<input <input
    type="email"
    id="email"
    required
    pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.(com|in|co\.in|org|org\.in|net|edu|edu\.in|gov\.in))$"
    placeholder="example@gmail.com"
    title="Enter a valid email address (e.g. user@gmail.com, user@company.in, user@college.co.in)">>
</div>

<div class="input-box">
<label>Age</label>
<input type="number" id="age" min="1" max="150" step="1" required placeholder="Enter Age">
</div>

<div class="input-box">
<label>Phone Number</label>
<input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="10 Digit Number">
</div>

<div class="input-box">
<label>Gender</label>

<select id="gender" required>
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

</div>

<div class="input-box">
<label>Course</label>

<select id="course" required>

<option value="">Select Course</option>

<option>BCA</option>
<option>BBA</option>
<option>B.Tech</option>
<option>MCA</option>
<option>MBA</option>

</select>

</div>

<div class="input-box full">
<label>Address</label>

<textarea id="address" rows="4" required placeholder="Enter Address"></textarea>

</div>

<button type="submit">Submit Registration</button>

</form>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
